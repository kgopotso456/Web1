<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Metadata configuration for responsive web design -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry | Woodwork</title>
    
    <!-- External CSS link for styling -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<hr>
    <!-- Navigation Header (Matches index.html structure) -->
    <header class="navbar">
        <div class="logo-container">
            <!-- Logo Image Placeholder -->
            <img src="images/logo-placeholder.png"
             alt="Woodwork Logo" class="site-logo" width="100" height="100">
            <span class="brand-name"><b>Woodwork</b></span>
        </div>
<hr>

        <!-- Aligned Navigation Menu -->
        <nav class="nav-links">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="enquiry.html" class="active">Enquiry</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
<hr>
    <!-- Main Content Container -->
    <main>
        <!-- Page Title Banner -->
        <section class="page-header">
            <h1>Request a Project Quote</h1>
            <p>Tell us about your custom timber project and we will get back to you with an estimate.</p>
        </section>

        <!-- Enquiry Form Section -->
        <section class="form-container">
            <h2>Project Enquiry Form</h2>
            <form id="enquiryForm">
                
                <!-- Full Name Field -->
                <div class="form-group">
                    <label for="fullName">Full Name:</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
                </div>

                <!-- Email Field -->
                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                </div>

                <!-- Phone Number Field -->
                <div class="form-group">
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter your contact number" required>
                </div>

                <!-- Service Selection Dropdown -->
                <div class="form-group">
                    <label for="serviceType">Service Required:</label>
                    <select id="serviceType" name="serviceType" required>
                        <option value="">Select a service category...</option>
                        <option value="cabinetry">Built-in Cabinetry & Shelving</option>
                        <option value="furniture">Bespoke Hardwood Furniture</option>
                        <option value="fitout">Commercial & Office Fit-out</option>
                        <option value="other">General Consultation / Custom Gift</option>
                    </select>
                </div>

                <!-- Project Details Textarea -->
                <div class="form-group">
                    <label for="details">Project Specifications & Details:</label>
                    <textarea id="details" name="details" rows="5" placeholder="Describe wood preferences, dimensions, or specific design ideas..." required></textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn">Submit Enquiry</button>
            </form>
        </section>
    </main>

    <!-- Site Footer -->
    <footer>
        <p>&copy; 2026 Woodwork. All rights reserved.</p>
    </footer>

    <!-- External JavaScript file -->
    <script src="js/main.js"></script>
</body>
</html>
